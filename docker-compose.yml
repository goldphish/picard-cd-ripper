# Picard (with the CD Ripper plugin and its bridge) plus cdcheckd, the phone app.
#
# Both containers mount the music directory at the same path, so paths can be
# passed between them unchanged. The bridge port is only reachable on the
# compose network; it is deliberately not published.
#
# Setup:
#   mkdir -p secrets && openssl rand -hex 32 > secrets/picard_bridge_token
#   cp /path/to/cdcheckd.example.toml cdcheckd.toml   # from accuraterip-verifier
#   docker compose up -d --build
#
# Add secrets/gcloud.json and uncomment the secret below to enable Cloud Vision.
#
volumes:
  picard-config:
    external: true
    name: docker_picard-config
  cdcheckd-data:

services:
  picard:
    build:
      context: .
      dockerfile: Dockerfile-picard
    container_name: picard
    ports:
      - "6800:5800"
      - "6900:5900"
    devices:
      - "/dev/disk/by-id/ata-ASUS_DRW-24B1ST_j_J6D0CL012583:/dev/sr0"
      - "/dev/disk/by-id/ata-HL-DT-ST_BD-RE_WH16NS60_KLLJALE0244:/dev/sr1"
    volumes:
      - picard-config:/config:rw
      - /media/music/flac:/storage:rw
      - /home/dan/src/picard-cd-ripper/nobrowser.sh:/usr/bin/xdg-open:ro
    environment:
      SUP_GROUP_IDS: 990
      CDRIPPER_BRIDGE_PORT: "8090"
      CDRIPPER_BRIDGE_TOKEN_FILE: /run/secrets/picard_bridge_token
    secrets:
      - picard_bridge_token

  cdcheckd:
    build:
      context: git@github.com:goldphish/accuraterip-verifier.git#main
      dockerfile: Dockerfile.cdcheckd
      ssh:
        - default
    ports:
      - "8080:8080"
    depends_on:
      - picard
    volumes:
      - ./cdcheckd.toml:/etc/cdcheckd.toml:ro
      - cdcheckd-data:/data
      - /media/music/flac:/storage:rw
    secrets:
      - picard_bridge_token
      - gcloud.json

secrets:
  picard_bridge_token:
    file: ./secrets/picard_bridge_token
  gcloud.json:
    file: ./secrets/gcloud.json
